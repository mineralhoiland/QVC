[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qvc"
version = "0.4.0"
description = "QVC / TEVC numerics: Option A* locks, TQGL solvers, L1 dictionary, vortex sector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
]

[project.optional-dependencies]
materials = [
  "pymatgen>=2024.1",
  "ase>=3.22",
  "phonopy>=2.20",
  "spglib>=2.0",
]
viz = [
  "matplotlib>=3.7",
  "plotly>=5.15",
  "kaleido>=0.2",
]
compute = [
  "numba>=0.57",
  "h5py>=3.8",
]
# TEVC / QVC–TDVT 3D workbench (python -m qvc.workbench) + VESTA/ParaView exporters
workbench = [
  "qvc[viz]",
  "panel>=1.4",
  "bokeh>=3.4",
  "pyvista>=0.43",
  "vtk>=9.2",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
full = [
  "qvc[materials,viz,compute,workbench,dev]",
  "jupyter>=1.0",
  "ipywidgets>=8.0",
]

[project.scripts]
qvc-verify = "qvc.verify_all:main"
qvc-workbench = "qvc.workbench.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "slow: GPE replay / Panel app tests (deselect with -m 'not slow')",
]

[tool.setuptools.packages.find]
include = ["qvc*", "qvc_l1*", "qvc_bkt*"]

[tool.setuptools.package-data]
qvc = ["locks/*.json"]
