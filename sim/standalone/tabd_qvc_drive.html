    let i0 = 1, term = 1;
    for (let k = 1; k < 24; k++) { term *= z2 / (k * k); i0 += term; }
    return -(Math.log(z / 2) + 0.5772156649) * i0;
  }
  const inv = 1 / z;
  const poly = 1 - 0.125 * inv + (9 / 128) * inv * inv;
  return Math.sqrt(Math.PI / (2 * z)) * Math.exp(-z) * poly;
}
function Fsum(x) { let s = 0; for (let n = 1; n <= 60; n++) s += besselK0(n * x); return s; }
function alcF(r, R, sig) {
  const t3 = Math.tanh(sig * R);
  return (Math.tanh(sig * (r + R)) - Math.tanh(sig * (r - R))) / (2 * Math.max(t3, 1e-6));
}
function horizonR(M, R, sig) {
  if (M <= 1) return null;
  let lo = R * 0.2, hi = R * 2.5;
  for (let i = 0; i < 40; i++) {
    const m = 0.5 * (lo + hi);
    if (M * alcF(m, R, sig) > 1) lo = m; else hi = m;
  }
  return 0.5 * (lo + hi);
}
function foldBranches(alpha, ell) {
  const dc = LOCK.deltaC;
  const ac = dc;
  if (alpha >= ac * 0.999) return { phys: null, unst: null };
  const roots = [];
  let prev = 1e-4 - (1 + alpha * (Math.log(1e-4) + ell));
  for (let i = 1; i <= 2000; i++) {
    const d = 1e-4 + (1 - 1e-4) * i / 2000;
    const f = d - (1 + alpha * (Math.log(d) + ell));
    if (prev * f < 0) roots.push(d);
    prev = f;
  }
  roots.sort((a, b) => b - a);
  return { phys: roots[0] ?? null, unst: roots[1] ?? null };
}
function GammaSch(ratio) {
  return LOCK.omega0 * ratio * Math.exp(-Math.PI / ratio);
}
function GammaTh(TmK) {
  const T = TmK / 1000;
  const E = 0.172e-3;
  const kB = 8.617333262145e-5;
  return LOCK.omega0 * Math.exp(-E / (kB * T));
}

const canvas = document.getElementById("gpu");
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x03060c, 1);
renderer.sortObjects = false;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03060c, 0.03);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 200);
camera.position.set(4.2, 2.1, 5.0);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.7;
controls.maxDistance = 48;

const MAX = 1048576;
const seed = new Float32Array(MAX * 4);
const rand = new Float32Array(MAX);
const golden = 0.61803398875;
for (let i = 0; i < MAX; i++) {
  seed[i * 4] = Math.acos(1 - 2 * ((i * golden) % 1));
  seed[i * 4 + 1] = TAU * ((i * golden * 1.324) % 1);
  seed[i * 4 + 2] = TAU * ((i * golden * 2.618) % 1);
  seed[i * 4 + 3] = (i % 54) + (i + 0.5) / MAX;
  let r = (Math.sin(i * 12.9898) * 43758.5453) % 1;
  if (r < 0) r += 1;
  rand[i] = r;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 4));
geo.setAttribute("aRand", new THREE.BufferAttribute(rand, 1));
geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAX * 3), 3));
geo.setDrawRange(0, P.count);

const uniforms = {
  uTime: { value: 0 }, uSpeed: { value: 1 }, uMode: { value: 0 },
  uQ: { value: 1 }, uScale: { value: 1 }, uTwist: { value: 1 },
  uLattice: { value: 1.55 }, uLink: { value: 0.85 }, uFlow: { value: 1.2 },
  uAlpha: { value: 0.45 }, uN: { value: 5 }, uG0: { value: 0.21 },
  uPointSize: { value: 0.85 }, uGlow: { value: 0.45 }, uOpacity: { value: 0.55 },
  uMach: { value: 1.35 }, uSigma: { value: 8 }, uRb: { value: 1 },
  uXb: { value: 0 }, uHeading: { value: 1 }, uNucleate: { value: 0 },
};
const mat = new THREE.ShaderMaterial({
  vertexShader: vert, fragmentShader: frag, uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const points = new THREE.Points(geo, mat);
points.frustumCulled = false;
scene.add(points);
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(3.4, 36, 24),
  new THREE.MeshBasicMaterial({ color: 0x0a3344, wireframe: true, transparent: true, opacity: 0.05 }),
));

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
new ResizeObserver(resize).observe(stage);
resize();

/* Babylon.js hull inset */
const B = window.BABYLON;
const bjsCanvas = document.getElementById("bjs");
const bEngine = new B.Engine(bjsCanvas, true, { adaptToDeviceRatio: true });
const bScene = new B.Scene(bEngine);
bScene.clearColor = new B.Color4(0.01, 0.02, 0.04, 1);
const bCam = new B.ArcRotateCamera("c", 0.9, 1.1, 4.2, B.Vector3.Zero(), bScene);
bCam.attachControl(bjsCanvas, true);
bCam.lowerRadiusLimit = 2; bCam.upperRadiusLimit = 10;
new B.HemisphericLight("l", new B.Vector3(0.3, 1, 0.2), bScene);
const hull = B.MeshBuilder.CreateSphere("hull", { diameter: 2.1, segments: 18 }, bScene);
const hullMat = new B.StandardMaterial("hm", bScene);
hullMat.wireframe = true; hullMat.emissiveColor = new B.Color3(0.15, 0.75, 0.95);
hullMat.alpha = 0.7; hull.material = hullMat;
const core = B.MeshBuilder.CreateTorus("core", { diameter: 0.7, thickness: 0.16, tessellation: 32 }, bScene);
const coreMat = new B.StandardMaterial("cm", bScene);
coreMat.emissiveColor = new B.Color3(1.0, 0.25, 0.6); coreMat.wireframe = true; core.material = coreMat;
const arrow = B.MeshBuilder.CreateCylinder("arr", { height: 1.4, diameterTop: 0, diameterBottom: 0.12 }, bScene);
arrow.rotation.z = -Math.PI / 2; arrow.position.x = 1.3;
const aMat = new B.StandardMaterial("am", bScene);
aMat.emissiveColor = new B.Color3(1.0, 0.7, 0.1); arrow.material = aMat;
const ring = B.MeshBuilder.CreateTorus("hz", { diameter: 2.05, thickness: 0.03, tessellation: 48 }, bScene);
const rMat = new B.StandardMaterial("rm", bScene);
rMat.emissiveColor = new B.Color3(1.0, 0.45, 0.05); ring.material = rMat;

function syncBabylon() {
  const s = 0.85 + 0.25 * P.Rb;
  hull.scaling.set(s, s, s);
  ring.scaling.set(s * (P.Mach > 1 ? 1 : 0.01), s * (P.Mach > 1 ? 1 : 0.01), s * (P.Mach > 1 ? 1 : 0.01));
  arrow.scaling.x = P.heading;
  arrow.position.x = 1.15 * P.heading * s;
  core.rotation.y += 0.01 * P.speed;
}

/* UI */
const tabsEl = document.getElementById("tabs");
TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.textContent = t.name;
  if (i === 0) b.classList.add("on");
  b.onclick = () => setTab(i);
  tabsEl.appendChild(b);
});
function setTab(i) {
  P.tab = i;
  [...tabsEl.children].forEach((el, j) => el.classList.toggle("on", j === i));
  renderDock();
  setLayerPills(TABS[i].layer);
}
function setLayerPills(L) {
  document.getElementById("pillL1").classList.toggle("on", L === 1);
  document.getElementById("pillL2").classList.toggle("on", L === 2);
}

function slider(key, label, min, max, step) {
  return `<div class="ctrl"><label>${label}<b id="v_${key}">${fmt(key, P[key])}</b></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${P[key]}" data-k="${key}"></div>`;
}
function fmt(k, v) {
  if (k === "count") return Math.round(v).toLocaleString();
  if (["Q", "N"].includes(k)) return Number(v).toFixed(0);
  if (["g0", "alpha"].includes(k)) return Number(v).toFixed(3);
  return Number(v).toFixed(2);
}
function renderDock() {
  const t = TABS[P.tab];
  document.getElementById("title").textContent = t.name;
  document.getElementById("blurb").textContent = t.blurb;
  document.getElementById("eq").textContent = t.eq;
  document.getElementById("chips").innerHTML = t.chips.map(([k, x]) => `<span class="chip ${k}">${x}</span>`).join("");
  document.getElementById("presets").innerHTML = Object.keys(PRESETS).map(n => `<button data-p="${n}">${n}</button>`).join("");
  document.getElementById("presets").onclick = (e) => {
    const n = e.target.dataset.p; if (!n) return;
    Object.assign(P, PRESETS[n]);
    setTab(P.tab);
    setLayerPills(PRESETS[n].layer ?? 1);
  };
  const common = slider("count", "Particles", 65536, 1048576, 16384)
    + slider("speed", "Time rate", 0, 2.5, 0.02)
    + slider("pointSize", "Point size", 0.3, 2.2, 0.05)
    + slider("glow", "Glow", 0, 1.2, 0.02)
    + slider("opacity", "Opacity", 0.15, 1, 0.02);
  let extra = "";
  if (t.id === "tabd") extra = slider("Mach", "Mach M=v_b/c_s", 0.1, 2.4, 0.02) + slider("sigma", "Wall σ", 2, 16, 0.1) + slider("Rb", "Bubble R", 0.4, 1.8, 0.02) + slider("Q", "Core Q", 1, 6, 1);
  if (t.id === "hopf") extra = slider("Q", "Hopf Q", 1, 8, 1) + slider("link", "Linking", 0, 1.4, 0.02) + slider("twist", "Twist", 0.2, 2.5, 0.02);
  if (t.id === "torsion") extra = slider("Q", "Charge Q", 1, 8, 1) + slider("twist", "Torsion flow", 0.2, 3, 0.02);
  if (t.id === "horizon") extra = slider("flow", "v_s / c_s", 0.3, 2.6, 0.02) + slider("Q", "Core Q", 1, 6, 1);
  if (t.id === "qvc") extra = slider("alpha", "A_ZPF / A_c proxy", 0.02, 0.99, 0.01) + slider("N", "N modes", 2, 8, 1) + slider("g0", "g₀", 0.05, 0.5, 0.005);
  if (t.id === "lattice") extra = slider("lattice", "Lattice a", 0.7, 2.8, 0.05) + slider("link", "Filaments", 0, 1.4, 0.02) + slider("Q", "Q", 1, 6, 1);
  document.getElementById("controls").innerHTML = extra + common;
  document.getElementById("controls").querySelectorAll("input").forEach((inp) => {
    inp.addEventListener("input", () => {
      const k = inp.dataset.k;
      P[k] = k === "count" || k === "Q" || k === "N" ? parseFloat(inp.value) : parseFloat(inp.value);
      document.getElementById("v_" + k).textContent = fmt(k, P[k]);
    });
  });
  document.getElementById("plotTitle").textContent = plotName(t.id);
}
function plotName(id) {
  return ({
    tabd: "Alcubierre f(r) and M f(r)",
    hopf: "VK bound E ≥ C|Q|^{3/4}",
    torsion: "Axial |T| ∼ Q/r²",
    horizon: "v_s(r) vs c_s · horizon",
    qvc: "Twin-channel Γ(T) + fold",
    lattice: "Democratic Spec(G)",
  })[id];
}

let nucT = 0;
document.getElementById("btnPause").onclick = () => {
  P.running = !P.running;
  document.getElementById("btnPause").textContent = P.running ? "PAUSE" : "RUN";
};
document.getElementById("btnReset").onclick = () => {
  camera.position.set(4.2, 2.1, 5.0);
  controls.target.set(0, 0, 0);
};
document.getElementById("btnNuc").onclick = () => { P.nucleate = 1; nucT = 0; };
document.getElementById("btnFlip").onclick = () => { P.heading *= -1; };

function applyUniforms() {
  const dens = Math.sqrt(65536 / Math.max(P.count, 65536));
  geo.setDrawRange(0, Math.min(MAX, Math.max(16384, Math.floor(P.count))));
  uniforms.uSpeed.value = P.speed;
  uniforms.uMode.value = TABS[P.tab].mode;
  uniforms.uQ.value = P.Q;
  uniforms.uTwist.value = P.twist;
  uniforms.uLattice.value = P.lattice;
  uniforms.uLink.value = P.link;
  uniforms.uFlow.value = P.flow;
  uniforms.uAlpha.value = P.alpha;
  uniforms.uN.value = P.N;
  uniforms.uG0.value = P.g0;
  uniforms.uPointSize.value = P.pointSize * (0.65 + 0.35 * dens);
  uniforms.uGlow.value = P.glow;
  uniforms.uOpacity.value = P.opacity * dens;
  uniforms.uMach.value = P.Mach;
  uniforms.uSigma.value = P.sigma;
  uniforms.uRb.value = P.Rb;
  uniforms.uXb.value = P.xb;
  uniforms.uHeading.value = P.heading;
  uniforms.uNucleate.value = P.nucleate;
}

function telemetry() {
  const t = TABS[P.tab];
  const rH = horizonR(P.Mach, P.Rb, P.sigma);
  const kappaH = 0.5 * Math.abs((P.Mach * P.Mach - 1) * P.sigma);
  const TH = kappaH / TAU;
  const spec = { lmax: (P.N - 1) * P.g0, lmin: -P.g0 };
  const fold = foldBranches(P.alpha * LOCK.deltaC, LOCK.ell);
  const rows = [];
  rows.push(["Particles", Math.floor(P.count).toLocaleString()]);
  if (t.id === "tabd") {
    rows.push(["Mach M", P.Mach.toFixed(3)]);
    rows.push([rH ? "r_H / R" : "r_H", rH ? (rH / P.Rb).toFixed(3) : "none (M≤1)"]);
    rows.push(["T_H (ℏ=k_B=1)", TH.toFixed(4)]);
    rows.push(["Claim", "acoustic FTL only"]);
  }
  if (t.id === "hopf") {
    rows.push(["VK |Q|^{3/4}", Math.pow(P.Q, 0.75).toFixed(4)]);
    rows.push(["Binding vs Q·E(1)", Math.pow(P.Q, 0.75) < P.Q ? "favors crystal" : "—"]);
  }
  if (t.id === "torsion") {
    rows.push(["Q_H = 1/N", (1 / P.N).toFixed(3)]);
    rows.push(["k_CS = 2N", String(2 * P.N)]);
    rows.push(["H-TEGR1", "open (conj)"]);
  }
  if (t.id === "horizon") {
    rows.push(["Γ_Sch (aud)", LOCK.GammaSch.toExponential(2) + " Hz"]);
    rows.push(["T_eq (aud)", LOCK.Teq + " mK"]);
    rows.push(["T* (prov)", LOCK.Tstar + " mK"]);
  }
  if (t.id === "qvc") {
    rows.push(["ν₀ (aud)", LOCK.nu0THz.toFixed(3) + " THz"]);
    rows.push(["δ_c (aud)", LOCK.deltaC.toFixed(3)]);
    rows.push(["Δ_QVC (prov)", LOCK.DeltaQVC.toFixed(3) + " meV"]);
    rows.push(["δσ_xy (aud)", LOCK.dxy.toExponential(2) + " S"]);
    rows.push(["λ_min / λ_max", spec.lmin.toFixed(3) + " / " + spec.lmax.toFixed(3)]);
    rows.push(["fold δ_phys", fold.phys != null ? fold.phys.toFixed(3) : "collapsed"]);
  }
  if (t.id === "lattice") {
    rows.push(["Goldstones", "5"]);
    rows.push(["Einstein lab claim", "not claimed"]);
  }
  document.getElementById("tele").innerHTML = rows.map(([a, b]) => {
    const cls = String(b).includes("open") || String(b).includes("prov") ? "warn" : "";
    return `<div class="row ${cls}"><span>${a}</span><span>${b}</span></div>`;
  }).join("");
  document.getElementById("hudTl").textContent = `TABD // ${t.name.toUpperCase()}`;
  document.getElementById("hudTr").textContent = `M=${P.Mach.toFixed(2)} · N=${Math.floor(P.count).toLocaleString()}`;
}

function drawPlot() {
  const c = document.getElementById("plot");
  const ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.fillStyle = "#040910"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#123044"; ctx.lineWidth = 1;
  ctx.strokeRect(48, 16, W - 64, H - 48);
  const id = TABS[P.tab].id;
  const xs = (i, n) => 48 + (W - 64) * i / (n - 1);
  const ys = (v, lo, hi) => 16 + (H - 48) * (1 - (v - lo) / (hi - lo));
  ctx.lineWidth = 2;
  if (id === "tabd") {
    ctx.beginPath(); ctx.strokeStyle = "#39e7ff";
    for (let i = 0; i < 200; i++) {
      const r = (i / 199) * 3 * P.Rb;
      const y = alcF(r, P.Rb, P.sigma);
      i ? ctx.lineTo(xs(i, 200), ys(y, 0, 1.6)) : ctx.moveTo(xs(i, 200), ys(y, 0, 1.6));
    }
    ctx.stroke();
    ctx.beginPath(); ctx.strokeStyle = "#ffb020";
    for (let i = 0; i < 200; i++) {
      const r = (i / 199) * 3 * P.Rb;
      const y = P.Mach * alcF(r, P.Rb, P.sigma);
      i ? ctx.lineTo(xs(i, 200), ys(y, 0, 1.6)) : ctx.moveTo(xs(i, 200), ys(y, 0, 1.6));
    }
    ctx.stroke();
    ctx.strokeStyle = "#ff3d9a"; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(48, ys(1, 0, 1.6)); ctx.lineTo(W - 16, ys(1, 0, 1.6)); ctx.stroke();
    ctx.setLineDash([]);
    legend(ctx, [["#39e7ff", "f(r)"], ["#ffb020", "M f(r)"], ["#ff3d9a", "|v|=c_s"]]);
  } else if (id === "hopf") {
    ctx.beginPath(); ctx.strokeStyle = "#39e7ff";
    for (let i = 1; i <= 80; i++) {
      const Q = i / 10;
      const y = Math.pow(Q, 0.75);
      i === 1 ? ctx.moveTo(xs(i - 1, 80), ys(y, 0, 8)) : ctx.lineTo(xs(i - 1, 80), ys(y, 0, 8));
    }
    ctx.stroke();
    ctx.beginPath(); ctx.strokeStyle = "#ff3d9a";
    for (let i = 1; i <= 80; i++) {
      const Q = i / 10;
      i === 1 ? ctx.moveTo(xs(i - 1, 80), ys(Q, 0, 8)) : ctx.lineTo(xs(i - 1, 80), ys(Q, 0, 8));
    }
    ctx.stroke();
    legend(ctx, [["#39e7ff", "C|Q|^{3/4}"], ["#ff3d9a", "Q·E(1)"]]);
  } else if (id === "torsion") {
    ctx.beginPath(); ctx.strokeStyle = "#ff3d9a";
    for (let i = 1; i < 200; i++) {
      const r = 0.15 + 2.8 * i / 199;
      const y = P.Q / (r * r);
      i === 1 ? ctx.moveTo(xs(i, 200), ys(y, 0, 40)) : ctx.lineTo(xs(i, 200), ys(y, 0, 40));
    }
    ctx.stroke();
    legend(ctx, [["#ff3d9a", "Q/r²"]]);
  } else if (id === "horizon") {
    ctx.beginPath(); ctx.strokeStyle = "#39e7ff";
    for (let i = 1; i < 200; i++) {
      const r = 0.12 + 2.5 * i / 199;
      const vs = P.flow / (TAU * r) * 2;
      i === 1 ? ctx.moveTo(xs(i, 200), ys(vs, 0, 3)) : ctx.lineTo(xs(i, 200), ys(vs, 0, 3));
    }
    ctx.stroke();
    ctx.strokeStyle = "#ffb020"; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(48, ys(1, 0, 3)); ctx.lineTo(W - 16, ys(1, 0, 3)); ctx.stroke();
    ctx.setLineDash([]);
    legend(ctx, [["#39e7ff", "v_s(r)"], ["#ffb020", "c_s"]]);
  } else if (id === "qvc") {
    ctx.beginPath(); ctx.strokeStyle = "#39e7ff";
    for (let i = 0; i < 160; i++) {
      const T = 50 + i * (1200 - 50) / 159;
      const g = Math.log10(GammaTh(T) + 1);
      i ? ctx.lineTo(xs(i, 160), ys(g, 7, 13)) : ctx.moveTo(xs(i, 160), ys(g, 7, 13));
    }
    ctx.stroke();
    const gs = Math.log10(LOCK.GammaSch);
    ctx.strokeStyle = "#ffb020";
    ctx.beginPath(); ctx.moveTo(48, ys(gs, 7, 13)); ctx.lineTo(W - 16, ys(gs, 7, 13)); ctx.stroke();
    legend(ctx, [["#39e7ff", "log Γ_th"], ["#ffb020", "Γ_Sch aud"]]);
  } else {
    const eigs = [...Array(P.N - 1).fill(-P.g0), (P.N - 1) * P.g0];
    const lo = -P.g0 * 1.4, hi = (P.N - 1) * P.g0 * 1.2;
    eigs.forEach((l, i) => {
      ctx.fillStyle = i === eigs.length - 1 ? "#ffb020" : "#39e7ff";
      const x = 70 + i * ((W - 100) / eigs.length);
      const y = ys(l, lo, hi);
      ctx.fillRect(x, y, 18, H - 48 - (y - 16));
    });
    legend(ctx, [["#39e7ff", "λ_min=−g₀"], ["#ffb020", "λ_max=(N−1)g₀"]]);
  }
}
function legend(ctx, items) {
  items.forEach((it, i) => {
    ctx.fillStyle = it[0];
    ctx.fillRect(56 + i * 150, 8, 10, 10);
    ctx.fillStyle = "#6d8aa0";
    ctx.font = "18px 'Share Tech Mono'";
    ctx.fillText(it[1], 70 + i * 150, 18);
  });
}

let t0 = performance.now() / 1000, frames = 0, fpsT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const t = now / 1000;
  const dt = t - t0; t0 = t;
  if (P.nucleate > 0) {
    nucT += dt;
    P.nucleate = Math.max(0, 1 - nucT / 2.2);
    if (P.nucleate === 0) nucT = 0;
  }
  applyUniforms();
  if (P.running) uniforms.uTime.value += dt;
  controls.update();
  renderer.render(scene, camera);
  syncBabylon();
  bScene.render();
  frames++; fpsT += dt;
  if (fpsT > 0.4) {
    document.getElementById("fps").textContent =
      `${Math.round(frames / fpsT)} fps · ${Math.floor(P.count).toLocaleString()} gpu points · Three.js + Babylon.js`;
    frames = 0; fpsT = 0;
    telemetry();
    drawPlot();
  }
}

renderDock();
requestAnimationFrame(loop);
window.addEventListener("resize", () => bEngine.resize());
</script>
